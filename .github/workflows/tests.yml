name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest numpy
      # Day 6 onwards needs a sentence embedding model. Installed here so
      # those tests actually run rather than silently skipping; if the
      # model cannot be fetched they skip with the reason printed, so a
      # rate limit never turns the badge red.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install sentence-transformers
      - run: pytest -q
